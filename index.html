<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deep Shift: Vesper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-id">
          <span class="sector">VESPER・F8 開採區</span>
          <span class="contract" id="contract">合約 F8-01</span>
        </div>
        <div class="hud-cash">
          <div class="credits" id="credits">₵0</div>
          <div class="rate" id="rate">+0 / 秒</div>
        </div>
        <nav class="hud-actions" aria-label="開採區選單">
          <button type="button" id="btn-report">報表</button>
          <button type="button" id="btn-stats">統計</button>
          <button type="button" id="btn-menu" aria-label="設定">設定</button>
        </nav>
      </header>
      <main id="stage">
        <canvas id="scene" aria-label="Vesper 礦坑側視圖：點樓層、升降梯或貨運港來升級"></canvas>
      </main>
    </div>

    <div id="sheet-backdrop" hidden></div>
    <section id="sheet" hidden aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-close" aria-label="關閉">關閉</button>
      </header>
      <div id="sheet-body"></div>
    </section>

    <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <button type="button" id="modal-next">繼續</button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
