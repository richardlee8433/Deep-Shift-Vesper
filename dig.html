<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vesper 地底防線</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <header class="hud" aria-label="狀態">
        <div class="meter">
          <span class="meter-label">護盾</span>
          <div class="bar"><i id="shield-fill"></i></div>
          <b id="shield-num" class="num">100</b>
        </div>
        <div class="meter meter-base">
          <span class="meter-label">核心</span>
          <div class="bar"><i id="base-fill"></i></div>
          <b id="base-num" class="num">300</b>
        </div>
        <div class="stat-ore" title="礦石：建造與升級用">
          <svg class="ico ore-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 6-3 12H8L5 9z"/></svg>
          <b id="ore" class="num">0</b>
        </div>
        <span id="wave" class="wave num"></span>
        <span class="threat" title="地心騷動：越高每波越大。遠古裝置、礦脈連鎖、挖到的深度都會提高它">騷動 <b id="threat-num" class="num">0</b></span>
        <span id="noise" class="noise num" title="噪音：在這一層每挖一格 +1，滿了會引來突襲"></span>
      </header>

      <main id="stage">
        <canvas id="scene" aria-label="礦坑：WASD 挖掘移動，1/2/3 建造，滑鼠點選"></canvas>
        <div id="tip" role="tooltip" hidden></div>
        <div id="toasts" aria-live="polite"></div>
      </main>

      <footer class="bar-bottom">
        <div id="builds" class="builds" aria-label="建造"></div>
        <div id="slots" class="slots" aria-label="遺物欄位"></div>
        <div class="acts">
          <button type="button" id="btn-pulse" class="act">
            <span class="act-fill" id="pulse-fill"></span>
            <span class="act-label" id="pulse-label">脈衝</span><kbd>Space</kbd>
          </button>
          <button type="button" id="btn-recall" class="act act-recall">
            <span class="act-fill" id="recall-fill"></span>
            <span class="act-label" id="recall-label">回基地</span><kbd>R</kbd>
          </button>
          <button type="button" id="btn-base" class="act"><span class="act-label">基地</span><kbd>B</kbd></button>
          <button type="button" id="btn-menu" class="act act-menu" aria-label="暫停選單">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><kbd>Esc</kbd>
          </button>
        </div>
      </footer>
    </div>

    <div id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" id="modal-card"></div>
    </div>

    <script type="module" src="/src/dig/main.ts"></script>
  </body>
</html>
